<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoSure</title>
<script>
  // Apply the saved theme before anything paints, so there is no flash of the wrong colours.
  try { var t = localStorage.getItem("invosure-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="#overview">Invo<span>Sure</span></a>
    <nav class="tabs" id="tabs">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#process" data-view="process">Process invoice</a>
      <a href="#invoices" data-view="invoices">Invoices</a>
      <a href="#pos" data-view="pos">Vendors and POs</a>
      <a href="#rules" data-view="rules">Rules</a>
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to dark mode" title="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="theme-label">Dark</span>
    </button>
  </div>
</header>

<main id="app" class="wrap"></main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-label="Invoice detail">
    <button class="icon-btn drawer-x" data-close aria-label="Close">
      <svg viewBox="0 0 20 20" width="20" height="20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div id="drawer-body"></div>
  </div>
</aside>

<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
